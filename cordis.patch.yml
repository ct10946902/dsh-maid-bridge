# dsh-maid-bridge 的 bundle 补丁层
#
# 只负责把插件本体插进来；不碰 profile 的 package.json 和模型路由。
# 可调项（都在这里改，升级插件不会覆盖这一层）：
#   port             本地监听端口（只绑 127.0.0.1）
#   secretKey        密钥（车万女仆站点配置里的 Secret Key，必须与这里一致）
#   sessionWhitelist 允许的会话 id 列表；空数组 = 所有非归档会话
#   prefix           投递给 DSH 的消息前缀（来源标注）
- insert:
    - id: maid-bridge
      name: 'dsh-maid-bridge'
      config:
        port: 8788
        secretKey: ''
        sessionWhitelist: []
        provider: 'opencode-go'
        model: 'deepseek-v4.1-flash'
        prefix: '【车万女仆】'
